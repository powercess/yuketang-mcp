# 发布到 npmjs，通过 Trusted Publishing（OIDC），无需任何 token。
#
# 前置条件（在 npmjs.com 上为 @powercess/yuketang-mcp 配置一次）：
#   Settings → Trusted Publisher → GitHub Actions
#     Organization or user: powercess
#     Repository:           yuketang-mcp
#     Workflow filename:    publish.yml
#     Allowed actions:      npm publish（勾选后才能直接发布；不勾选则只能 stage publish）
#
# 打 tag 触发：git push --follow-tags
name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC：换取短期发布令牌，并自动生成 provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "tag v$TAG != package version $PKG"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm test

      # Trusted Publishing 下 provenance 自动生成，无需 --provenance 标志。
      # NPM_CONFIG_PROVENANCE 保持默认（开启）。
      - name: Publish to npm
        run: npm publish --access public
